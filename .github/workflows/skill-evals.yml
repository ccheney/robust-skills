name: Skill evals

on:
  push:
    branches: [main, 'feature/**']
    paths: ['skills/**', 'evals/**', 'scripts/**', '.github/workflows/skill-evals.yml']
  pull_request:
    paths: ['skills/**', 'evals/**', 'scripts/**', '.github/workflows/skill-evals.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: Evaluation case set
        type: choice
        options: [smoke, full]
        default: smoke
      repeats:
        description: Trials per case (1–10)
        type: number
        default: 1
      max_requests:
        description: Hard request cap for this run (1–500)
        type: number
        default: 24
      baseline_ref:
        description: Optional previous skills Git ref for a third comparison arm
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: skill-evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.11.1'
      - name: Install validation dependency
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Prepare isolated JavaScript grader
        run: docker pull node:24.11.1-bookworm-slim
      - name: Validate skills and evaluation inventory
        run: |
          python scripts/validate_skills.py
          python -m evals.validation
      - name: Test the harness and graders without an LLM
        env:
          RUN_DOCKER_EVAL_TESTS: '1'
        run: python -m unittest evals.test_evals -v

  live:
    # No model requests on ordinary pushes or untrusted pull requests.
    # This variable designates a key from a Gemini project with billing disabled.
    if: github.event_name == 'workflow_dispatch' && vars.GEMINI_FREE_TIER == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.11.1'
      - name: Prepare dependencies
        run: |
          python -m pip install 'PyYAML==6.0.2'
          docker pull node:24.11.1-bookworm-slim
      - name: Run bounded free-tier evals
        id: evals
        # Initially report-only; failed and unscored trials remain visible in artifacts.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER: ${{ vars.GEMINI_FREE_TIER }}
          EVAL_PROFILE: ${{ inputs.profile }}
          EVAL_REPEATS: ${{ inputs.repeats }}
          EVAL_MAX_REQUESTS: ${{ inputs.max_requests }}
          EVAL_BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          variants=candidate,none
          baseline_args=()
          if [ -n "$EVAL_BASELINE_REF" ]; then
            variants=candidate,none,baseline
            baseline_args=(--baseline-ref "$EVAL_BASELINE_REF")
          fi
          python -m evals.runner --profile "$EVAL_PROFILE" \
            --repeats "$EVAL_REPEATS" --max-requests "$EVAL_MAX_REQUESTS" \
            --variants "$variants" "${baseline_args[@]}"
      - name: Publish summary
        if: always()
        run: |
          if [ -f evals/results/latest/summary.md ]; then
            cat evals/results/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No evaluation report was produced. Inspect setup or runner failure; this is not a passing benchmark.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Store evaluation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-eval-results
          path: evals/results/latest/
          if-no-files-found: warn
          retention-days: 7
